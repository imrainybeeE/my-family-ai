# Builds the app as a static site and publishes it to GitHub Pages on every push to main.
# Pages has no server, so the AI helper is off there unless the VITE_AI_URL repository
# variable points at a hosted copy of server.ts; everything else, including the demo family, works.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC: '1'
          VITE_AI_URL: ${{ vars.VITE_AI_URL }}
      # Hash routes need no rewrites; a 404 copy still sends stray paths to the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
