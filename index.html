<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Family AI</title>
    <meta name="description" content="A student-built family app: everyone finds their flower, the family garden grows, and an AI helper plans meals, days out and better conversations from your answers." />
    <meta name="theme-color" content="#e4ecf5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family AI" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="My Family AI" />
    <meta property="og:description" content="Find out how each of you blooms, and what you love doing together." />
    <meta property="og:type" content="website" />
    <link rel="preload" href="/src/assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Paint the right paper before React loads, so the page never flashes the wrong theme.
      try {
        var m = localStorage.getItem('myfamilyai_theme');
        var p = new URLSearchParams(location.search).get('theme');
        var dark = p ? p === 'dark' : m === 'dark' || ((!m || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var q = new URLSearchParams(location.search).get('palette');
        var palette = q === 'ocean' || q === 'forest' ? q : localStorage.getItem('myfamilyai_palette');
        document.documentElement.dataset.palette = palette === 'forest' ? 'forest' : 'ocean';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
